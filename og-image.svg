<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="984" cy="337" r="32" fill="#1565c0" opacity="0.10"/>
    <circle cx="1128" cy="668" r="31" fill="#1565c0" opacity="0.07"/>
    <circle cx="847" cy="522" r="82" fill="#1565c0" opacity="0.12"/>
    <circle cx="1213" cy="712" r="62" fill="#1565c0" opacity="0.18"/>
    <circle cx="84" cy="-55" r="69" fill="#1565c0" opacity="0.16"/>
    <circle cx="431" cy="370" r="21" fill="#1565c0" opacity="0.17"/>
    <rect x="675" y="-93" width="29" height="20" rx="8" fill="#0d47a1" opacity="0.12" transform="rotate(39, 393, -40)"/>
    <rect x="-9" y="717" width="50" height="76" rx="8" fill="#0d47a1" opacity="0.11" transform="rotate(23, 603, 364)"/>
    <rect x="306" y="436" width="87" height="68" rx="8" fill="#0d47a1" opacity="0.12" transform="rotate(17, 1073, 498)"/>
    <rect x="1199" y="278" width="23" height="64" rx="8" fill="#0d47a1" opacity="0.11" transform="rotate(32, 652, 634)"/>
    <rect x="450" y="568" width="25" height="73" rx="8" fill="#0d47a1" opacity="0.11" transform="rotate(32, 449, 660)"/>
    <rect x="9" y="17" width="87" height="85" rx="8" fill="#0d47a1" opacity="0.12" transform="rotate(31, 167, 172)"/>
    <rect x="365" y="-22" width="70" height="62" rx="8" fill="#0d47a1" opacity="0.04" transform="rotate(10, 369, 510)"/>
    <rect x="1280" y="33" width="72" height="47" rx="8" fill="#0d47a1" opacity="0.07" transform="rotate(9, 1009, 549)"/>
    <polygon points="291,-80 389,116 193,116" fill="#1565c0" opacity="0.09"/>
    <polygon points="684,275 710,327 658,327" fill="#1565c0" opacity="0.07"/>
    <polygon points="724,197 763,275 685,275" fill="#1565c0" opacity="0.03"/>
    <polygon points="-76,36 12,212 -164,212" fill="#1565c0" opacity="0.04"/>

  <!-- Wave at bottom -->
  <path d="M0,566 C360,598 840,534 1200,566 L1200,630 L0,630Z" fill="#1565c0" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    광주 홈페이지 제작 추천
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    광주 — 홈페이지 제작
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#00bcd4" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#00bcd4" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    광주 광주 홈페이지 제작 추천 — 홈페이지 제작
  </text>
</svg>